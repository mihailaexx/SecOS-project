# Prefix: Ctrl+a (easier than Ctrl+b, doesn't conflict with vim)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Mouse support (scroll, click panes, resize by dragging)
set -g mouse on

# Truecolor + italics over SSH
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"

# Start numbering at 1 (easier to reach than 0)
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# Bigger history buffer
set -g history-limit 50000

# Split panes using | and - (intuitive), open in current dir
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Reload config with prefix + r
bind r source-file ~/.tmux.conf \; display "Config reloaded"

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Vim-style copy mode
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# Status bar — minimal, clean
set -g status-style "bg=default,fg=white"
set -g status-left "#[fg=green,bold][#S] "
set -g status-right "#[fg=cyan]%H:%M #[fg=yellow]%d-%b"
set -g status-left-length 30

# Faster key response for nvim
set -sg escape-time 10
